prSections:
    - title: Review
      filters: is:open -is:draft review-requested:@me -org:cloudfoundry
    - title: Involved
      filters: is:open involves:@me -author:@me
    - title: Mine
      filters: is:open author:@me -is:draft
    - title: Drafts
      filters: is:open author:@me is:draft
issuesSections:
    - title: My Issues
      filters: is:open author:@me
    - title: Assigned
      filters: is:open assignee:@me
    - title: Involved
      filters: is:open involves:@me -author:@me
notificationsSections:
    - title: All
      filters: ""
    - title: Created
      filters: reason:author
    - title: Participating
      filters: reason:participating
    - title: Mentioned
      filters: reason:mention
    - title: Review Requested
      filters: reason:review-requested
    - title: Assigned
      filters: reason:assign
    - title: Subscribed
      filters: reason:subscribed
    - title: Team Mentioned
      filters: reason:team-mention
repo:
    branchesRefetchIntervalSeconds: 30
    prsRefetchIntervalSeconds: 60
defaults:
    preview:
        open: false
        width: 0.45
        height: 0.6
        position: auto
    prsLimit: 20
    prApproveComment: ""
    issuesLimit: 20
    notificationsLimit: 20
    view: prs
    layout:
        prs:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 20
            author:
                width: 15
            authorIcon:
                hidden: false
            labels:
                width: 22
                hidden: true
            assignees:
                width: 20
                hidden: true
            base:
                width: 15
                hidden: true
            lines:
                width: 15
        issues:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 15
            creator:
                width: 10
            creatorIcon:
                hidden: false
            assignees:
                width: 20
                hidden: true
    refetchIntervalMinutes: 0
keybindings:
    universal:
        - key: ctrl+r
          builtin: refreshAll
        - key: R
          builtin: refresh
    prs:
        - key: r
          name: Review PR
          command: dev-win.sh {{.RepoPath}} {{.PrNumber}}
repoPaths:
    ironcore-dev/*: ~/src/ironcore/*
theme:
    colors:
        text:
            primary: "#1f2328"
            secondary: "#0969da"
            inverted: "#ffffff"
            faint: "#59636e"
            warning: "#bc4c00"
            success: "#1a7f37"
            error: "#d1242f"
        background:
            selected: "#eaeef2"
        border:
            primary: "#0969da"
            secondary: "#d1d9e0"
            faint: "#e8ebee"
pager:
    diff: delta
confirmQuit: false
showAuthorIcons: true
smartFilteringAtLaunch: true
includeReadNotifications: true
